# SecureVPN Client Configuration
# High-performance encrypted VPN client with advanced obfuscation

mode: client

# Cryptographic settings (must match server)
crypto:
  cipher: chacha20poly1305           # Encryption cipher (chacha20poly1305 or aes256gcm)
  key_exchange: curve25519           # Key exchange algorithm
  hash_function: blake2s             # Hash function
  key_rotation_interval: 120         # Key rotation interval in seconds

# Network configuration
network:
  interface_name: svpn0              # TUN interface name
  mtu: 1420                          # Maximum transmission unit
  dns_servers:                       # DNS servers to use
    - 1.1.1.1
    - 8.8.8.8

# Traffic obfuscation (bypass DPI)
obfuscation:
  enabled: true                      # Enable traffic obfuscation
  method: tls                        # Obfuscation method (tls, http, dns)
  port_hopping: true                 # Enable port hopping
  decoy_traffic: false               # Generate decoy traffic

# Client-specific settings
client:
  server_address: 79.132.136.194     # VPN server address
  server_port: 51820                 # VPN server port
  server_public_key: ""              # Server public key (get from server)
  
  # Client key file paths (will be generated if they don't exist)
  private_key_path: client_private.key
  public_key_path: client_public.key
  
  # Routing configuration
  allowed_ips:                       # IP ranges to route through VPN
    - 0.0.0.0/0                      # Route all traffic (full tunnel)
    # - 10.0.0.0/8                   # Route only private networks (split tunnel)
    # - 192.168.0.0/16
    # - 172.16.0.0/12
  
  split_tunneling: false             # Enable split tunneling

# Logging configuration
logging:
  level: INFO                        # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  max_file_size: 10485760            # Max log file size in bytes (10MB)
  backup_count: 5                    # Number of backup log files
