# SecureVPN Server Configuration
# High-performance encrypted VPN server with advanced obfuscation

mode: server

# Cryptographic settings
crypto:
  cipher: chacha20poly1305           # Encryption cipher (chacha20poly1305 or aes256gcm)
  key_exchange: curve25519           # Key exchange algorithm
  hash_function: blake2s             # Hash function
  key_rotation_interval: 120         # Key rotation interval in seconds

# Network configuration
network:
  interface_name: svpn0              # TUN interface name
  mtu: 1420                          # Maximum transmission unit
  ipv4_network: 10.8.0.0/24          # IPv4 network range for clients
  dns_servers:                       # DNS servers for clients
    - 1.1.1.1
    - 8.8.8.8

# Traffic obfuscation (bypass DPI)
obfuscation:
  enabled: true                      # Enable traffic obfuscation
  method: tls                        # Obfuscation method (tls, http, dns)
  port_hopping: true                 # Enable port hopping
  decoy_traffic: false               # Generate decoy traffic

# Server-specific settings
server:
  bind_address: 0.0.0.0              # Server bind address (0.0.0.0 for all interfaces)
  port: 51820                        # Server port
  max_clients: 100                   # Maximum concurrent clients
  keepalive_interval: 25             # Keepalive interval in seconds
  
  # Key file paths (will be generated if they don't exist)
  private_key_path: server_private.key
  public_key_path: server_public.key

# Logging configuration
logging:
  level: INFO                        # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  file_path: /var/log/securevpn/server.log  # Log file path (null for stdout only)
  max_file_size: 10485760            # Max log file size in bytes (10MB)
  backup_count: 5                    # Number of backup log files
