version: '3.8'

services:
  securevpn-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: securevpn-server
    
    # Network configuration
    ports:
      - "51820:51820/udp"
    
    # Required for TUN interface
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    
    # Volumes
    volumes:
      - ./configs:/etc/securevpn:ro
      - securevpn-logs:/var/log/securevpn
      - securevpn-keys:/etc/securevpn/keys
    
    # Environment variables
    environment:
      - PYTHONPATH=/app/src
      - SECUREVPN_LOG_LEVEL=INFO
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(('0.0.0.0', 51820)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Command
    command: ["server", "--config", "/etc/securevpn/server.conf"]

  # Optional: Prometheus monitoring
  securevpn-monitoring:
    image: prom/prometheus:latest
    container_name: securevpn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  securevpn-logs:
    driver: local
  securevpn-keys:
    driver: local
  prometheus-data:
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
